name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  print-contracts:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /
      VITE_DATA_PROVIDER: supabase
      VITE_SUPABASE_URL: https://print-tests.supabase.co
      VITE_SUPABASE_ANON_KEY: print-tests-anon-key
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install print test browser
        run: npx playwright install --with-deps chromium

      - name: Verify contract print isolation
        run: npm run test:print

      - name: Preserve failed print checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-print-failures
          path: test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: print-contracts
    env:
      VITE_BASE_PATH: /Gestion-de-Contrats/
      VITE_DATA_PROVIDER: supabase
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
